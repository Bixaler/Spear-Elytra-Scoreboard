<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ARENA CX — Cyberpunk Minecraft esports scoreboard for OBS Studio broadcasts" />
    <title>ARENA CX — Minecraft Scoreboard</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Rajdhani:wght@500;600;700&family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <script>
      // GitHub Pages SPA shim: supports clean deep-links written as /?r=overlay
      // (the bundled 404.html forwards unknown paths here). Primary routing is
      // hash-based (#/overlay, #/control) which works on any static host.
      (function () {
        try {
          var m = location.search.match(/[?&]r=(overlay|control)\b/);
          if (m && !location.hash) {
            location.replace(
              location.pathname + location.search.replace(/([?&])r=(overlay|control)&?/, '$1') + '#/' + m[2]
            );
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
